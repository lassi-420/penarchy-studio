version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: penarchy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: penarchy
      POSTGRES_PASSWORD: penarchy
      POSTGRES_DB: penarchy_studio
    ports:
      - "5432:5432"
    volumes:
      - penarchy_pgdata:/var/lib/postgresql/data

volumes:
  penarchy_pgdata:
